<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Lab</title>
  <meta name="description" content="Lantern Lab is where students build. Weekly build nights, demo nights each semester. You own everything you make.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@700&family=Jost:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #192135;
      --faint: #8a8f9c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Jost", "Futura", "Century Gothic", sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    a { color: inherit; text-decoration: none; }

    img { width: 48px; height: 48px; border-radius: 10px; margin-bottom: 40px; }
    h1 {
      font-family: "Josefin Sans", "Futura", "Century Gothic", sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      font-size: clamp(32px, 5vw, 72px);
      line-height: 0.95;
      letter-spacing: 0.04em;
      max-width: 22ch;
      text-wrap: balance;
    }
    p { color: var(--faint); margin-top: 24px; line-height: 1.6; }

    body > * { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    h1 { animation-delay: .1s; }
    p { animation-delay: .25s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { body > * { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <img src="logo.png" alt="Lantern Lab">
  <h1>Lantern Lab is where students build.</h1>
  <p>Weekly build nights.<br>You own what you make.</p>
</body>
</html>
