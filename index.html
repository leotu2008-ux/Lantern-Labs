<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Lab</title>
  <meta name="description" content="Lantern Lab is where students build. Weekly build nights, demo nights each semester. You own everything you make.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #192135;
      --faint: #8a8f9c;
      --rule: #dcd9d1;
      --pad: clamp(20px, 5vw, 64px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 0.01em;
      -webkit-font-smoothing: antialiased;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      padding: var(--pad);
    }
    a { color: inherit; text-decoration: none; }

    header, footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--faint); }
    header img { width: 32px; height: 32px; border-radius: 7px; display: block; }

    main { align-self: end; max-width: 880px; padding: 12vh 0 10vh; }
    h1 {
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      font-size: clamp(3rem, 9vw, 7.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
    }

    .rows { margin-top: 48px; max-width: 420px; border-top: 1px solid var(--rule); }
    .rows div { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--rule); }
    .rows span:last-child { color: var(--faint); }

    .apply { display: inline-flex; gap: 10px; margin-top: 40px; font-size: 14px; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
    .apply i { font-style: normal; transition: transform .25s ease; }
    .apply:hover i { transform: translateX(4px); }

    /* one quiet entrance */
    header, main > *, footer { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    main > h1 { animation-delay: .1s; }
    main > .rows { animation-delay: .3s; }
    main > .apply { animation-delay: .45s; }
    footer { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      header, main > *, footer { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Lantern Lab">
    <span>New York pilot</span>
  </header>

  <main>
    <h1>Lantern Lab is where students build.</h1>
    <div class="rows">
      <div><span>Build night</span><span>Weekly</span></div>
      <div><span>Crit</span><span>Every two weeks</span></div>
      <div><span>Demo night</span><span>Each semester</span></div>
    </div>
    <a class="apply" href="mailto:hello@lanternlabs.com?subject=Lantern%20Lab%20application">Apply <i>→</i></a>
  </main>

  <footer>
    <span>You own 100% of what you make.</span>
    <span>© <span id="y">2026</span></span>
  </footer>

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
