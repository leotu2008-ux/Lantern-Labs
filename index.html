<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lantern Labs</title>
  <meta name="description" content="Lantern Labs builds thoughtful tools that light the way.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fffdf9;
      --text: #192135;
      --muted: #6b7183;
      --accent: #192135;
      --line: #ece7df;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; }

    header { padding: 32px 0; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .logo img { width: 36px; height: 36px; border-radius: 8px; }

    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; padding: 96px 0 120px; }
    h1 { font-size: clamp(2.2rem, 6vw, 3.2rem); line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 20px; }
    p { color: var(--muted); font-size: 1.1rem; margin-bottom: 32px; }
    .contact { color: var(--text); font-weight: 600; text-decoration: none; border-bottom: 2px solid var(--accent); padding-bottom: 2px; }
    .contact:hover { opacity: 0.7; }

    footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--muted); font-size: 0.875rem; }

    @media (max-width: 600px) { main { padding: 56px 0 80px; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="logo"><img src="logo.png" alt="">Lantern Labs</div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <h1>Building tools that <span>light the way</span>.</h1>
      <p>We're a small studio exploring ideas and turning the promising ones into products people love to use.</p>
      <a class="contact" href="mailto:hello@lanternlabs.com">hello@lanternlabs.com →</a>
    </div>
  </main>

  <footer>
    <div class="wrap">© <span id="year">2026</span> Lantern Labs</div>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
